<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project Template" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="img/favicon.ico" />

    <title>Spiloversigt</title>
  </head>

  <body>
    <header>
      <h1>Spiloversigt</h1>
      <p class="header-subtitle">Find dit næste yndlingsspil hos spilcafeen</p>
   <main>
  <form
    id="game-filters"
    class="game-controls"
    aria-label="Søg og filtrér spil"
  >
    <div class="searchbar-container">
      <label for="search-input">Søg efter spil</label>
      <input
        id="search-input"
        type="search"
        placeholder="Søg spil..."
      />
    </div>

    <div class="filterbar">
      <div class="filter-group">
        <label for="players-select">Antal spillere</label>
        <select id="players-select"></select>
      </div>

      <div class="filter-group">
        <label for="genre-select2">Varighed</label>
        <select id="genre-select2"></select>
      </div>

      <div class="filter-group">
        <label for="genre-select1">Genre</label>
        <select id="genre-select1"></select>
      </div>

      <button
        id="clear-filters"
        class="clear-btn"
        type="button"
      >
        Ryd filtre
      </button>
    </div>
  </form>

  <div id="game-list" aria-live="polite"></div>
</main>

    <dialog id="game-dialog">
      <div id="dialog-content"></div>
      <button
        id="close-dialog"
      >
        Luk
      </button>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
