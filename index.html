<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Find brætspil hos Spilcaféen efter antal spillere, varighed og kategori"
    >

    <link rel="stylesheet" href="app.css">
    <link rel="icon" href="img/favicon.ico">

    <title>Spiloversigt</title>
  </head>

  <body>
    <header>
      <h1>Spiloversigt</h1>
      <h2>Find dit næste yndlingsspil hos spilcafeen</h2>
    </header>

    <main>
      <!-- Search Bar -->
      <div class="searchbar-container">
        <label for="search-input">Søg efter spil</label>
        <input
          id="search-input"
          type="search"
          placeholder="Søg spil..."
        >
      </div>

      <!-- Filter Bar -->
      <div class="filterbar">
        <label for="players-select">Antal spillere</label>
        <select id="players-select"></select>

        <label for="genre-select2">Varighed</label>
        <select id="genre-select2"></select>

        <label for="genre-select1">Genre</label>
        <select id="genre-select1"></select>

        <button
          id="clear-filters"
          class="clear-btn"
          type="button"
        >
          <span class="btn-icon"></span>
          <span class="btn-text">Ryd filtre</span>
        </button>
      </div>

      <!-- Game List -->
      <div id="game-list">
        <!-- Game cards will be rendered here by JavaScript -->
      </div>
    </main>

    <dialog id="game-dialog">
      <div id="dialog-content"></div>

      <button
        id="close-dialog"
        type="button"
        onclick="document.getElementById('game-dialog').close()"
      >
        Luk
      </button>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
